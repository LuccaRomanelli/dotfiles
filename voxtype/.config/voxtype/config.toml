# Voxtype configuration for Hyprland + Multilingual (PT/EN)

state_file = "auto"

[hotkey]
# Disabled - using Hyprland keybindings (SUPER+D)
enabled = false

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60

[whisper]
# Large v3 turbo model - optimized for GPU acceleration
model = "large-v3-turbo"
# Auto-detect language (works for English and Portuguese)
language = "auto"

[output]
mode = "type"

# Compositor integration hooks (modifier key fix)
pre_recording_command = "hyprctl dispatch submap voxtype_recording"
pre_output_command = "hyprctl dispatch submap voxtype_suppress"
post_output_command = "hyprctl dispatch submap reset"
fallback_to_clipboard = true

[output.notification]
# Show notification when recording starts
on_recording_start = true
# Show notification when transcription begins
on_recording_stop = true
# Show notification with transcribed text
on_transcription = true
